bindr=SUPER,Super_L,spawn,$HOME/.local/bin/launcher.sh
bind=SUPER,Space,spawn,$HOME/.local/bin/launcher.sh
bind=CTRL+ALT,Delete,spawn,$HOME/.local/bin/session-menu.sh
bind=SUPER,L,spawn,$HOME/.local/bin/lock-screen.sh
bind=SUPER+ALT,L,spawn,$HOME/.local/bin/lock-screen.sh

bindr=CTRL+SUPER+SHIFT,R,spawn_shell,killall -SIGUSR2 waybar

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER,0,view,10,0

bind=SUPER+ALT,1,tag,1,0
bind=SUPER+ALT,2,tag,2,0
bind=SUPER+ALT,3,tag,3,0
bind=SUPER+ALT,4,tag,4,0
bind=SUPER+ALT,5,tag,5,0
bind=SUPER+ALT,6,tag,6,0
bind=SUPER+ALT,7,tag,7,0
bind=SUPER+ALT,8,tag,8,0
bind=SUPER+ALT,9,tag,9,0
bind=SUPER+ALT,0,tag,10,0

bind=SUPER,Page_Up,viewtoleft,0
bind=SUPER,Page_Down,viewtoright,0
bind=CTRL+SUPER,Left,viewtoleft,0
bind=CTRL+SUPER,Right,viewtoright,0

bind=SUPER+ALT,Page_Up,tagtoleft,0
bind=SUPER+ALT,Page_Down,tagtoright,0
bind=CTRL+SUPER+SHIFT,Left,tagtoleft,0
bind=CTRL+SUPER+SHIFT,Right,tagtoright,0

bind=SUPER+ALT,S,tag_special_tag

bind=ALT,Tab,focusstack,next
bind=SHIFT+ALT,Tab,focusstack,prev
bind=CTRL+ALT,Tab,groupfocus,next
bind=CTRL+SHIFT+ALT,Tab,groupfocus,prev
bind=SUPER,U,groupleave

bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Right,move_client,right
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Down,move_client,down

bind=SUPER,minus,resizewin,-100,0
bind=SUPER,equal,resizewin,100,0
bind=SUPER+ALT,Left,resizewin,-100,0
bind=SUPER+ALT,Right,resizewin,100,0
bind=SUPER+SHIFT,minus,resizewin,0,-50
bind=SUPER+SHIFT,equal,resizewin,0,50
bind=SUPER+ALT,Up,resizewin,0,-50
bind=SUPER+ALT,Down,resizewin,0,50

bind=SUPER,Z,moveresize,curmove
bind=SUPER,X,moveresize,curresize
bind=CTRL+SUPER,Backslash,centerwin
bind=SUPER,P,toggleglobal
bind=SUPER,F,togglefullscreen
bind=SUPER+ALT,F,togglemaximizescreen
bind=SUPER+ALT,Space,togglefloating
bind=SUPER,Q,killclient

bind=SUPER,T,spawn,foot
bind=SUPER,W,spawn,brave
bind=SUPER,C,spawn,zeditor
bind=SUPER,E,spawn,thunar

bindl=NONE,Print,spawn,flameshot gui

bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl set 5%+
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-

bindl=SUPER+SHIFT,M,spawn_shell,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioMute,spawn_shell,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioMicMute,spawn_shell,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl=NONE,XF86AudioRaiseVolume,spawn_shell,wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 10%+
bindl=NONE,XF86AudioLowerVolume,spawn_shell,wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%-

bindl=SUPER+SHIFT,L,spawn,systemctl suspend

bind=SUPER,V,spawn,$HOME/.local/bin/clipboard-menu.sh

bind=SUPER+ALT,F12,spawn,notify-send -u low -i dialog-information-symbolic Test notification "Here is a really long message to test truncation and wrapping" -a Shell

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

axisbind=SUPER,UP,viewtoleft
axisbind=SUPER,DOWN,viewtoright
axisbind=SUPER+ALT,UP,tagtoleft
axisbind=SUPER+ALT,DOWN,tagtoright

gesturebind=none,left,4,viewtoright
gesturebind=none,right,4,viewtoleft
gesturebind=none,up,3,toggle_special_tag
gesturebind=none,down,3,toggle_special_tag
gesturebind=none,down,4,spawn,systemctl suspend-then-hibernate
