source=~/.config/mango/appearance.conf
source=~/.config/mango/layout.conf
source=~/.config/mango/input.conf
source=~/.config/mango/rules.conf
source=~/.config/mango/binds.conf
source=~/.config/mango/autostart.conf
source=~/.config/mango/wallpaper.conf

env=QT_QPA_PLATFORMTHEME,qtengine
env=QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env=QT_AUTO_SCREEN_SCALE_FACTOR,1
env=XCURSOR_THEME,Sweet-cursors
env=XCURSOR_SIZE,24
env=GDK_BACKEND,wayland,x11
env=QT_QPA_PLATFORM,wayland;xcb
env=SDL_VIDEODRIVER,wayland,x11,windows
env=CLUTTER_BACKEND,wayland
env=ELECTRON_OZONE_PLATFORM_HINT,auto
env=XDG_SESSION_TYPE,wayland
env=_JAVA_AWT_WM_NONREPARENTING,1

monitor_rule=name:.*,scale:1.0
xwayland_ignore_scale=0

allow_tearing=0
focus_on_activate=1
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
float_full_to_top=0
drag_tile_to_tile=1
drag_tile_small=1
allow_lock_transparent=1
allow_shortcuts_inhibit=1
disable_middle_paste=1
idle_inhibit_ignore_visible=0
idle_inhibit_when_fullscreen=0
xwayland_persistence=1
sync_obj_enable=1
auto_reload_config=1
